name: 'Rust Native Build'

# Builds the Rust `mcarchive` crate (NetEase MC Bedrock archive
# encrypt/decrypt) from the private BreezeLauncher repo into an Android
# shared library and uploads it to THIS public repo's `native` release.
#
# The launcher pulls `libmcarchive.so` from that release at build time
# (see app/build.gradle.kts downloadNativeLibs task), so the Rust
# toolchain is NOT required for the regular APK build.
#
# Triggers:
#   - workflow_dispatch (manual)
#   - push to main that touches rust/mcarchive/**

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rust/mcarchive/**'
      - '.github/workflows/rust-build.yml'

env:
  RUST_TARGET: 'aarch64-linux-android'
  PRIVATE_REPO: 'wisebreeze/BreezeLauncher'
  ARTIFACT_RELEASE_TAG: 'artifact'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout private source repo
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch main https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git .
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Capture private repo SHA
        id: private_sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Configure cargo for Android NDK
        # ubuntu-latest ships NDK r29 (29.0.14206865) at
        # $ANDROID_HOME/ndk/29.0.14206865 — same version the Gradle
        # build pins via ndkVersion. cargo's cc crate needs CC_* /
        # CARGO_TARGET_*_LINKER / AR_* env vars to find the NDK clang.
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          NDK_TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          API=24
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> $GITHUB_ENV
          echo "CC_aarch64_linux_android=${NDK_TOOLCHAIN}/aarch64-linux-android${API}-clang" >> $GITHUB_ENV
          echo "CXX_aarch64_linux_android=${NDK_TOOLCHAIN}/aarch64-linux-android${API}-clang++" >> $GITHUB_ENV
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/aarch64-linux-android${API}-clang" >> $GITHUB_ENV
          echo "AR_aarch64_linux_android=${NDK_TOOLCHAIN}/llvm-ar" >> $GITHUB_ENV

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/mcarchive/target
          key: cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-${{ hashFiles('rust/mcarchive/Cargo.toml', 'rust/mcarchive/Cargo.lock', 'rust/mcarchive/.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_TARGET }}-

      - name: Build libmcarchive.so
        # --release applies the size-optimized profile from Cargo.toml
        # (opt-level="z", lto=true, strip=true, panic="abort").
        # RUSTFLAGS passes -Wl,-z,max-page-size=16384 so the .so is
        # 16KB-aligned for Android 15+ devices (also in .cargo/config.toml
        # for local builds, but set here explicitly so CI is not
        # dependent on config discovery).
        working-directory: rust/mcarchive
        env:
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384 -C link-arg=-Wl,-z,common-page-size=16384"
        run: |
          cargo build --release --target ${{ env.RUST_TARGET }}
          ls -lh target/${{ env.RUST_TARGET }}/release/libmcarchive.so

      - name: Verify 16KB page alignment
        # Android 15+ requires .so LOAD segments aligned to 16384 bytes.
        # readelf -W (wide) puts each LOAD on one line with the align
        # field as the last hex token. Fail if any align != 0x4000.
        run: |
          SO=rust/mcarchive/target/${{ env.RUST_TARGET }}/release/libmcarchive.so
          echo "ELF LOAD segments:"
          readelf -W -l "$SO" | grep -E "^\s+LOAD" || true
          misaligned=$(readelf -W -l "$SO" | grep -E "^\s+LOAD" | grep -vE "0x4000\s*$" | wc -l)
          if [ "$misaligned" -ne 0 ]; then
            echo "ERROR: $misaligned LOAD segment(s) not aligned to 0x4000 (16384)"
            readelf -W -l "$SO" | grep -E "^\s+LOAD" | grep -vE "0x4000\s*$"
            exit 1
          fi
          echo "OK: all LOAD segments aligned to 16KB"

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp rust/mcarchive/target/${{ env.RUST_TARGET }}/release/libmcarchive.so \
             artifact/libmcarchive-${{ steps.private_sha.outputs.sha }}.so
          # Also keep a stable-name copy so the launcher's Gradle
          # download task can fetch a fixed URL.
          cp rust/mcarchive/target/${{ env.RUST_TARGET }}/release/libmcarchive.so \
             artifact/libmcarchive.so
          sha256sum artifact/libmcarchive.so > artifact/libmcarchive.so.sha256
          ls -la artifact/

      - name: Ensure artifact release exists
        # Reuse the same `artifact` release that android.yml uploads APKs
        # to — no separate native release. .so and APK coexist thanks to
        # distinct filenames.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Build Artifacts" \
            --notes "Automated build artifacts from CI. Latest APK and native libs are always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null \
            || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload .so to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for f in artifact/libmcarchive.so artifact/libmcarchive.so.sha256 artifact/libmcarchive-${{ steps.private_sha.outputs.sha }}.so; do
            gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$(basename $f)" --repo "${{ github.repository }}" 2>/dev/null || true
            gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$f" --clobber --repo "${{ github.repository }}"
          done
          echo "Uploaded libmcarchive.so (sha ${{ steps.private_sha.outputs.sha }}) to artifact release"
