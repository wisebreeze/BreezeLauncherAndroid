name: 'Sync config to Gitee'

# Mirrors config files (mods.json, announcements.json) from this public
# BreezeLauncherAndroid repo to the Gitee BreezeLauncherApp repo (root-level),
# so the app can keep fetching them from Gitee's raw endpoint while the
# source of truth lives in this repo.
#
# Triggers:
#   - Any push to main that touches config/mods.json or config/announcements.json
#   - Manual dispatch
#
# Required secrets:
#   GITEE_TOKEN - Gitee PAT with `projects` push scope.

on:
  push:
    branches: [main]
    paths:
      - 'config/mods.json'
      - 'config/announcements.json'
      - '.github/workflows/sync-config-to-gitee.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-config-to-gitee
  cancel-in-progress: false

env:
  GITEE_REPO: wisebreeze/BreezeLauncherApp
  GITEE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate config files
        run: |
          python3 - <<'PY'
          import json, sys

          # --- mods.json ---
          with open('config/mods.json') as f:
              d = json.load(f)
          arr = d.get('android_mods')
          if not isinstance(arr, list) or not arr:
              print('::error::mods.json missing non-empty android_mods array')
              sys.exit(1)
          for i, m in enumerate(arr):
              for k in ('name', 'author', 'license', 'link'):
                  if not m.get(k):
                      print(f'::error::android_mods[{i}] missing field {k}')
                      sys.exit(1)
          print('mods.json OK:', len(arr), 'entries')

          # --- announcements.json ---
          with open('config/announcements.json') as f:
              d = json.load(f)
          arr = d.get('announcements')
          if not isinstance(arr, list):
              print('::error::announcements.json missing announcements array')
              sys.exit(1)
          for i, a in enumerate(arr):
              for k in ('published_at', 'content_zh', 'content_en'):
                  if not a.get(k):
                      print(f'::error::announcements[{i}] missing field {k}')
                      sys.exit(1)
          print('announcements.json OK:', len(arr), 'entries')
          PY

      - name: Mirror config files to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          GITEE_WORKDIR="$RUNNER_TEMP/gitee-work"
          mkdir -p "$GITEE_WORKDIR"
          cd "$GITEE_WORKDIR"
          git clone --depth 1 --branch "${{ env.GITEE_BRANCH }}" \
            "https://wisebreeze:${GITEE_TOKEN}@gitee.com/${{ env.GITEE_REPO }}.git" .
          git config user.name "wisebreeze"
          git config user.email "12232263+wisebreeze@user.noreply.gitee.com"

          cp "$GITHUB_WORKSPACE/config/mods.json" "$GITEE_WORKDIR/mods.json"
          cp "$GITHUB_WORKSPACE/config/announcements.json" "$GITEE_WORKDIR/announcements.json"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to push to Gitee."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync config from BreezeLauncherAndroid

          Source: https://github.com/wisebreeze/BreezeLauncherAndroid/commit/${{ github.sha }}"

          git push origin "${{ env.GITEE_BRANCH }}"
          echo "Pushed to Gitee: https://gitee.com/${{ env.GITEE_REPO }}/raw/${{ env.GITEE_BRANCH }}/mods.json"
          echo "Pushed to Gitee: https://gitee.com/${{ env.GITEE_REPO }}/raw/${{ env.GITEE_BRANCH }}/announcements.json"
