name: 'Sync update manifest to Gitee'

# Mirrors the contents of update/ (update.json + changeLog/*.md) from this
# public BreezeLauncherAndroid repo to the Gitee configuration repository
# wisebreeze/BreezeLauncherApp. The Android app fetches update.json from
# Gitee at launch (once per day) via AppUpdateChecker.
#
# Why Gitee: Gitee raw URLs are reachable from mainland China without a
# proxy, which is critical for the in-app update check. GitHub raw URLs are
# often blocked or extremely slow in that region.
#
# Trigger: any push to main that touches update/**, plus manual dispatch.
# The workflow does a sparse checkout of only the update/ directory and
# force-pushes it to the Gitee repo's main branch, overwriting any existing
# update.json / changeLog/ files there. Other files in the Gitee repo
# (mods.json, subscribe.json, README.md, .gitignore) are preserved because
# we only overwrite paths that exist under update/ here.

on:
  push:
    branches: [main]
    paths:
      - 'update/**'
      - '.github/workflows/sync-update-to-gitee.yml'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without pushing to Gitee (validation only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

concurrency:
  group: sync-update-to-gitee
  cancel-in-progress: false

env:
  GITEE_REPO: wisebreeze/BreezeLauncherApp
  GITEE_BRANCH: main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo (sparse, update/ only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            update
          sparse-checkout-cone-mode: false

      - name: Validate update.json
        run: |
          set -euo pipefail
          if [ ! -f update/update.json ]; then
            echo "::error::update/update.json not found"
            exit 1
          fi
          # Validate JSON syntax and required fields.
          python3 - <<'PY'
          import json, sys
          with open("update/update.json", encoding="utf-8") as f:
              data = json.load(f)
          required = ["version", "versionCode", "download", "changeLog"]
          missing = [k for k in required if k not in data or data[k] == ""]
          if missing:
              print(f"::error::update.json missing required fields: {missing}")
              sys.exit(1)
          if not isinstance(data["versionCode"], int):
              print("::error::update.json versionCode must be an integer")
              sys.exit(1)
          if "forceUpdate" in data and not isinstance(data["forceUpdate"], bool):
              print("::error::update.json forceUpdate must be a boolean")
              sys.exit(1)
          if "forceUpdateBelowVersionCode" in data and not isinstance(data["forceUpdateBelowVersionCode"], int):
              print("::error::update.json forceUpdateBelowVersionCode must be an integer")
              sys.exit(1)
          print(f"OK: version={data['version']} versionCode={data['versionCode']} "
                f"forceUpdate={data.get('forceUpdate', False)} "
                f"forceUpdateBelowVersionCode={data.get('forceUpdateBelowVersionCode', 'N/A')}")
          PY

      - name: Verify changelog file referenced by update.json exists
        run: |
          set -euo pipefail
          # Extract the changelog filename from the URL and check it exists
          # locally. The URL points to Gitee raw, but the file must also be
          # present in update/changeLog/ here so the mirror is consistent.
          CHANGELOG_URL=$(python3 -c "import json; print(json.load(open('update/update.json'))['changeLog'])")
          CHANGELOG_FILE=$(basename "$CHANGELOG_URL")
          if [ ! -f "update/changeLog/$CHANGELOG_FILE" ]; then
            echo "::error::Changelog file update/changeLog/$CHANGELOG_FILE referenced by update.json not found"
            exit 1
          fi
          echo "Changelog file found: update/changeLog/$CHANGELOG_FILE"

      - name: Push to Gitee
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret is not set"
            exit 1
          fi

          # Clone the Gitee repo (shallow) into a temp dir.
          GITEE_WORKDIR="$RUNNER_TEMP/gitee-mirror"
          rm -rf "$GITEE_WORKDIR"
          git clone --depth 1 --branch "$GITEE_BRANCH" \
            "https://wisebreeze:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" \
            "$GITEE_WORKDIR"

          cd "$GITEE_WORKDIR"
          git config user.name "wisebreeze"
          git config user.email "12232263+wisebreeze@user.noreply.gitee.com"

          # Mirror update/ contents onto the Gitee repo root.
          # - update/update.json      -> update.json
          # - update/changeLog/*.md   -> changeLog/*.md
          # We rsync so deletions on the source side propagate (e.g. a
          # changelog file removed here is also removed on Gitee).
          rsync -a --delete \
            --include='update.json' \
            --include='changeLog/' \
            --include='changeLog/*.md' \
            --exclude='*' \
            "$GITHUB_WORKSPACE/update/" "$GITEE_WORKDIR/"

          # Also drop the README.md from update/changeLog/ if present, since
          # the Gitee repo's changeLog/ should only contain version files.
          rm -f "$GITEE_WORKDIR/changeLog/README.md"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to push to Gitee."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync update manifest from BreezeLauncherAndroid@${GITHUB_SHA::7}

          Source: https://github.com/wisebreeze/BreezeLauncherAndroid/commit/${GITHUB_SHA}
          Triggered by: ${GITHUB_ACTOR}"

          git push origin "$GITEE_BRANCH"
          echo "Pushed to Gitee: https://gitee.com/${GITEE_REPO}"

      - name: Dry-run summary
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "Dry run — no push performed."
          echo "Files that would be mirrored to Gitee:"
          find update -type f | sort
