name: 'Release on publish'

# Triggered when a GitHub Release is published (user clicks "Publish
# release" in the GitHub UI). At that point the release body (changelog)
# is already authored and the tag already exists, so the workflow can
# safely read the body and attach the APK.
#
# Flow:
#   1. Download BreezeLauncher-default-release.apk from the `artifact`
#      release on THIS repo and attach it to the newly published release.
#   2. Use the release body (Markdown, authored by the maintainer
#      when creating the release) as the changelog. Save it to
#      update/changeLog/<versionName>.md and commit to main.
#   3. Compute the APK's MD5 and regenerate update/update.json with the
#      new version / versionCode / md5 / download URL / changelog URL.
#      Commit to main.
#   4. Mirror update/ to the Gitee BreezeLauncherApp repo (update.json +
#      changeLog/*.md), exactly like sync-update-to-gitee.yml does on
#      regular pushes.
#   5. Create (or update) a Gitee release for the same tag and upload
#      the APK as a set of split parts (BreezeLauncher-default-release.apk.partNN)
#      as attachments, so the Gitee mirror can host APKs larger than
#      Gitee's 100 MB single-attachment cap. Previous parts on the same
#      release are deleted before the new ones are uploaded. Each part's
#      URL + MD5 + size is recorded in update.json under `parts[]` so
#      the app can download them sequentially, verify each chunk, and
#      concatenate them back into the original APK.
#
# Tag naming convention: v<versionName>, e.g. v26.7.17. The leading `v`
# is stripped to obtain the versionName. versionCode is derived from the
# versionName by the same scheme the Gradle build uses:
#   <yearPart><MM><DD>  (yearPart = year - 2000 for 2000-2099)
# e.g. 26.7.17 -> 260717, 3010.6.1 -> 30100601
#
# Required secrets:
#   GITEE_TOKEN          - Gitee PAT with `projects` push scope, used to
#                          push update.json + changelog to Gitee.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. v26.7.17). Release must already exist.'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-on-publish
  cancel-in-progress: false

env:
  GITEE_REPO: wisebreeze/BreezeLauncherApp
  GITEE_BRANCH: main
  APK_ASSET_NAME: BreezeLauncher-default-release.apk
  ARTIFACT_RELEASE_TAG: artifact
  # Gitee caps a single release attachment at 100 MB. Split the APK
  # into chunks below this limit so large builds can still be mirrored
  # to Gitee. The app reassembles the parts at download time.
  APK_PART_BYTES: 94371840

jobs:
  release:
    # Skip the `artifact` release — it is a rolling release maintained by
    # the Android CI workflow (latest build APK), not a versioned release.
    # Publishing it would otherwise trigger this workflow and fail when
    # trying to derive a versionCode from "artifact".
    if: github.event.release.tag_name != 'artifact'
    runs-on: ubuntu-latest
    # Gitee release attachment uploads are slow (~150 KB/s from GitHub
    # Actions). A 90 MB part takes ~10 min, and a full release with 2+
    # parts + re-mirror steps can exceed 20 min. 30 min gives headroom.
    timeout-minutes: 30
    steps:
      - name: Resolve tag
        id: tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "$RELEASE_TAG" ]; then
            TAG="$RELEASE_TAG"
          else
            echo "::error::Could not determine release tag (not a release event and no manual tag input)."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          # Strip leading 'v' to get versionName (v26.7.17 -> 26.7.17)
          VERSION_NAME="${TAG#v}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          # Strip any "-fixed<N>" suffix before deriving versionCode,
          # so tags like v26.8.14-fixed1 parse correctly. The suffix
          # is informational only and does not affect versionCode.
          VERSION_NAME_BASE="${VERSION_NAME%%-*}"
          # Derive versionCode from versionName using the Gradle scheme:
          #   <yearPart><MM><DD>  (yearPart = year - 2000 for 2000-2099)
          # e.g. 26.7.17 -> 260717, 3010.6.1 -> 30100601
          YEAR=$(echo "$VERSION_NAME_BASE" | cut -d. -f1)
          MONTH=$(echo "$VERSION_NAME_BASE" | cut -d. -f2)
          DAY=$(echo "$VERSION_NAME_BASE" | cut -d. -f3)
          if [ -z "$DAY" ]; then
            echo "::error::versionName '$VERSION_NAME' must be <year>.<month>.<day>[-fixed<N>]"
            exit 1
          fi
          if [ "$YEAR" -ge 0 ] && [ "$YEAR" -le 99 ]; then
            YEAR=$((2000 + YEAR))
          fi
          VERSION_CODE=$(printf '%d%02d%02d' "$YEAR" "$MONTH" "$DAY")
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Resolved tag=$TAG versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Checkout this repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Fetch release body (changelog)
        id: release_body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Read the release body. If the release was created without a
          # body, fall back to the tag's annotation message.
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null || true)
          if [ -z "$BODY" ] || [ "$BODY" = "null" ]; then
            BODY=$(git tag -l --format='%(contents:body)' "$TAG")
          fi
          if [ -z "$BODY" ]; then
            echo "::error::No release body found for tag $TAG. Create the release with changelog content as the body."
            exit 1
          fi
          # Persist to a temp file to preserve newlines and avoid shell
          # quoting issues when re-using it later.
          printf '%s' "$BODY" > /tmp/changelog.md
          echo "Changelog length: $(wc -c < /tmp/changelog.md) bytes"
          echo "has_body=true" >> $GITHUB_OUTPUT

      - name: Download APK from artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/apk
          gh release download "${{ env.ARTIFACT_RELEASE_TAG }}" \
            --repo "${{ github.repository }}" \
            --pattern "${{ env.APK_ASSET_NAME }}" \
            --dir /tmp/apk
          ls -la /tmp/apk/
          test -f "/tmp/apk/${{ env.APK_ASSET_NAME }}"

      - name: Attach APK to the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Clobber any previously uploaded asset with the same name.
          gh release delete-asset "$TAG" "${{ env.APK_ASSET_NAME }}" \
            --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload "$TAG" "/tmp/apk/${{ env.APK_ASSET_NAME }}" \
            --repo "${{ github.repository }}" --clobber
          echo "Attached ${{ env.APK_ASSET_NAME }} to release $TAG"

      - name: Compute APK MD5
        id: md5
        run: |
          MD5=$(md5sum "/tmp/apk/${{ env.APK_ASSET_NAME }}" | cut -d' ' -f1)
          echo "md5=$MD5" >> $GITHUB_OUTPUT
          echo "APK MD5: $MD5"

      - name: Split APK into Gitee-friendly parts
        # Gitee caps a single release attachment at 100 MB. Split the
        # APK into chunks of APK_PART_BYTES (90 MB) so each part fits.
        # The app reassembles the parts in order at download time.
        # `split -d -a 2` produces .part00, .part01, ...; we rename to
        # .part01, .part02, ... so the first chunk is 1-indexed and the
        # sort order matches the chunk order on the Gitee release page.
        id: split
        run: |
          APK_PATH="/tmp/apk/${{ env.APK_ASSET_NAME }}"
          PART_DIR="/tmp/apk/parts"
          rm -rf "$PART_DIR"
          mkdir -p "$PART_DIR"

          split -b "${{ env.APK_PART_BYTES }}" -d -a 2 "$APK_PATH" "$PART_DIR/${{ env.APK_ASSET_NAME }}.part"

          # Rename .part00 -> .part01, .part01 -> .part02, ... so parts
          # are 1-indexed and sort lexicographically in chunk order.
          shopt -s nullglob
          PART_COUNT=0
          for f in "$PART_DIR/${{ env.APK_ASSET_NAME }}.part"*; do
            PART_COUNT=$((PART_COUNT + 1))
          done
          # Process in reverse so we never overwrite an unrenamed file.
          for i in $(seq $((PART_COUNT - 1)) -1 0); do
            src=$(printf "$PART_DIR/${{ env.APK_ASSET_NAME }}.part%02d" "$i")
            dst=$(printf "$PART_DIR/${{ env.APK_ASSET_NAME }}.part%02d" "$((i + 1))")
            mv "$src" "$dst"
          done
          echo "Split into $PART_COUNT parts"
          ls -la "$PART_DIR/"

          # Compute per-part MD5 + size and emit a JSON array for the
          # update.json `parts` field. The URLs are filled in later by
          # the Gitee upload step (we only know them after upload).
          python3 - <<'PY'
          import os, hashlib, json
          part_dir = "/tmp/apk/parts"
          base = os.environ["APK_ASSET_NAME"]
          files = sorted(f for f in os.listdir(part_dir) if f.startswith(base + ".part"))
          parts = []
          for f in files:
              p = os.path.join(part_dir, f)
              h = hashlib.md5()
              with open(p, "rb") as fh:
                  for chunk in iter(lambda: fh.read(1 << 20), b""):
                      h.update(chunk)
              parts.append({"name": f, "md5": h.hexdigest(), "size": os.path.getsize(p)})
          with open("/tmp/apk/parts.json", "w") as out:
              json.dump(parts, out, indent=2)
          print(json.dumps(parts, indent=2))
          PY

          echo "part_count=$PART_COUNT" >> $GITHUB_OUTPUT

      - name: Write changelog file
        run: |
          mkdir -p update/changeLog
          cp /tmp/changelog.md "update/changeLog/${{ steps.tag.outputs.version_name }}.md"
          echo "Wrote update/changeLog/${{ steps.tag.outputs.version_name }}.md"

      - name: Regenerate update.json
        # Writes update.json with the standard fields plus a `parts`
        # array. The `parts` URLs are left empty here and filled in by
        # the Gitee upload step (which rewrites update.json in place
        # after each part is uploaded). This keeps the manifest
        # committable even if the Gitee upload step is skipped.
        run: |
          export VERSION="${{ steps.tag.outputs.version_name }}"
          export VERSION_CODE="${{ steps.tag.outputs.version_code }}"
          export MD5="${{ steps.md5.outputs.md5 }}"
          # Canonical download URL points to THIS repo's release asset.
          # The app may rewrite it to a mirror prefix at download time
          # when the user has enabled GitHub mirror acceleration.
          export DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ env.APK_ASSET_NAME }}"
          export CHANGELOG_URL="https://gitee.com/${{ env.GITEE_REPO }}/raw/${{ env.GITEE_BRANCH }}/changeLog/${VERSION}.md"

          # Preserve forceUpdate / forceUpdateBelowVersionCode from the
          # existing update.json if present (so a release does not
          # silently clear a force-update floor). Default to false / 0.
          export FORCE_UPDATE="false"
          export FORCE_BELOW="0"
          if [ -f update/update.json ]; then
            export FORCE_UPDATE=$(python3 -c "import json;print(str(json.load(open('update/update.json')).get('forceUpdate', False)).lower())" 2>/dev/null || echo "false")
            export FORCE_BELOW=$(python3 -c "import json;print(json.load(open('update/update.json')).get('forceUpdateBelowVersionCode', 0))" 2>/dev/null || echo "0")
          fi

          # Merge the per-part metadata (name/md5/size from the split
          # step) into update.json with a placeholder `url` field that
          # the Gitee upload step will overwrite.
          python3 - <<'PY'
          import json, os
          version = os.environ["VERSION"]
          version_code = int(os.environ["VERSION_CODE"])
          md5 = os.environ["MD5"]
          download_url = os.environ["DOWNLOAD_URL"]
          changelog_url = os.environ["CHANGELOG_URL"]
          force_update = os.environ["FORCE_UPDATE"] == "true"
          force_below = int(os.environ["FORCE_BELOW"])

          with open("/tmp/apk/parts.json") as f:
              parts_meta = json.load(f)
          # Each part gets a placeholder url; the Gitee upload step
          # fills it in after the attachment is created.
          parts = [{"url": "", **p} for p in parts_meta]

          manifest = {
              "version": version,
              "versionCode": version_code,
              "forceUpdate": force_update,
              "forceUpdateBelowVersionCode": force_below,
              "download": download_url,
              "md5": md5,
              "parts": parts,
              "changeLog": changelog_url,
          }
          with open("update/update.json", "w") as out:
              json.dump(manifest, out, indent=2)
              out.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
          echo "--- update.json ---"
          cat update/update.json
          # Validate JSON syntax before committing.
          python3 -c "import json;json.load(open('update/update.json'))"

      - name: Commit update manifest to main
        run: |
          git add update/update.json "update/changeLog/${{ steps.tag.outputs.version_name }}.md"
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(update): bump manifest to ${{ steps.tag.outputs.version_name }}

          - Attach ${{ env.APK_ASSET_NAME }} to release v${{ steps.tag.outputs.version_name }}
          - Update changeLog/${{ steps.tag.outputs.version_name }}.md from release body
          - Regenerate update.json (versionCode=${{ steps.tag.outputs.version_code }}, md5=${{ steps.md5.outputs.md5 }})"
          # Checkout is at the tag (detached HEAD) for release events, so
          # there is no local `main` branch to push. Push the current HEAD
          # to the remote `main` ref directly.
          git push origin HEAD:main
          echo "Pushed manifest to main"

      - name: Setup Python for Gitee push
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate manifest before Gitee sync
        run: |
          python3 - <<'PY'
          import json, sys
          with open('update/update.json') as f:
              d = json.load(f)
          for k in ('version', 'versionCode', 'download', 'changeLog'):
              if not d.get(k):
                  print(f'::error::update.json missing required field {k}')
                  sys.exit(1)
          cl = f"update/changeLog/{d['version']}.md"
          import os
          if not os.path.isfile(cl):
              print(f'::error::changelog file {cl} not found')
              sys.exit(1)
          print('Manifest OK:', d)
          PY

      - name: Mirror update/ to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          GITEE_WORKDIR="$RUNNER_TEMP/gitee-work"
          mkdir -p "$GITEE_WORKDIR"
          cd "$GITEE_WORKDIR"
          git clone --depth 1 --branch "${{ env.GITEE_BRANCH }}" \
            "https://wisebreeze:${GITEE_TOKEN}@gitee.com/${{ env.GITEE_REPO }}.git" .
          git config user.name "wisebreeze"
          git config user.email "12232263+wisebreeze@user.noreply.gitee.com"

          # Mirror update/ contents onto the Gitee repo root.
          # - update/update.json      -> update.json
          # - update/changeLog/*.md   -> changeLog/*.md
          # rsync with --delete so removed changelog files propagate.
          rsync -a --delete \
            --include='update.json' \
            --include='changeLog/' \
            --include='changeLog/*.md' \
            --exclude='*' \
            "$GITHUB_WORKSPACE/update/" "$GITEE_WORKDIR/"

          # The changeLog/README.md in this repo is documentation only
          # and must not appear on Gitee (the app would try to render it
          # as a changelog if update.json ever pointed at it).
          rm -f "$GITEE_WORKDIR/changeLog/README.md"

          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to push to Gitee."
            exit 0
          fi

          git add -A
          git commit -m "chore: sync update manifest for v${{ steps.tag.outputs.version_name }}

          Source: https://github.com/${{ github.repository }}/releases/tag/v${{ steps.tag.outputs.version_name }}
          versionCode: ${{ steps.tag.outputs.version_code }}
          md5: ${{ steps.md5.outputs.md5 }}"

          git push origin "${{ env.GITEE_BRANCH }}"
          echo "Pushed to Gitee: https://gitee.com/${{ env.GITEE_REPO }}"

      - name: Mirror release to Gitee
        # Create (or update) a Gitee release for the same tag and upload
        # the APK as a set of split parts (BreezeLauncher-default-release.apk.partNN).
        # Gitee caps a single release attachment at 100 MB, so the APK is
        # split into 90 MB chunks (see the "Split APK" step above). The
        # app downloads each part in order, verifies its MD5, and
        # concatenates them back into the original APK.
        #
        # Idempotent: re-running on the same tag deletes every existing
        # *.partNN attachment before uploading the new set, so stale
        # parts from a previous run do not accumulate.
        #
        # After each part is uploaded, its browser_download_url is
        # written back into update/update.json (parts[].url) and the
        # manifest is re-committed to main + re-mirrored to Gitee so
        # the app can resolve the part URLs immediately.
        id: gitee_release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "::error::GITEE_TOKEN secret is not set. Add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi

          TAG="${{ steps.tag.outputs.tag }}"
          PART_DIR="/tmp/apk/parts"
          GITEE_API="https://gitee.com/api/v5/repos/${{ env.GITEE_REPO }}"

          # 1. Try to fetch an existing release by tag.
          RELEASE_ID=$(curl -fsSL -X GET \
            "${GITEE_API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}" 2>/dev/null \
            | jq -r '.id // empty' 2>/dev/null || echo "")

          # 2. If not found, create a new release using the same body
          #    (changelog) as the GitHub release. Gitee auto-creates the
          #    tag from target_commitish if it does not exist yet.
          if [ -z "$RELEASE_ID" ]; then
            echo "Creating Gitee release for tag $TAG..."
            CREATE_RESP=$(curl -fsSL -X POST "${GITEE_API}/releases" \
              -d "access_token=${GITEE_TOKEN}" \
              -d "tag_name=${TAG}" \
              -d "name=${TAG}" \
              --data-urlencode "body@/tmp/changelog.md" \
              -d "target_commitish=${{ env.GITEE_BRANCH }}")
            RELEASE_ID=$(echo "$CREATE_RESP" | jq -r '.id // empty')
            if [ -z "$RELEASE_ID" ]; then
              echo "::error::Failed to create Gitee release. Response: $CREATE_RESP"
              exit 1
            fi
            echo "Created Gitee release ID: $RELEASE_ID"
          else
            echo "Found existing Gitee release ID: $RELEASE_ID"
          fi

          # 3. Delete EVERY existing attachment whose name starts with
          #    "<APK_ASSET_NAME>.part" so re-runs do not leave stale
          #    parts from a previous build. We also delete the legacy
          #    single-APK attachment (APK_ASSET_NAME) if present, since
          #    the app now reads parts[] instead.
          EXISTING_ATTACHMENTS=$(curl -fsSL -X GET \
            "${GITEE_API}/releases/${RELEASE_ID}?access_token=${GITEE_TOKEN}" \
            | jq -r --arg prefix "${{ env.APK_ASSET_NAME }}" \
              '.attach_files[]? | select(.name == $prefix or (.name | startswith($prefix + ".part"))) | "\(.id) \(.name)"' 2>/dev/null || echo "")

          if [ -n "$EXISTING_ATTACHMENTS" ]; then
            echo "$EXISTING_ATTACHMENTS" | while read -r AID ANAME; do
              [ -z "$AID" ] && continue
              echo "Deleting existing attachment: $ANAME (id=$AID)..."
              curl -fsSL -X DELETE \
                "${GITEE_API}/releases/${RELEASE_ID}/attach_files/${AID}?access_token=${GITEE_TOKEN}" \
                || echo "WARN: failed to delete attachment $ANAME, continuing"
            done
          fi

          # 4. Upload each part in order. After every successful upload,
          #    write the part's browser_download_url back into
          #    update/update.json so the manifest on main always reflects
          #    the latest uploaded part (useful if the run is interrupted).
          shopt -s nullglob
          PART_FILES=( "$PART_DIR/${{ env.APK_ASSET_NAME }}.part"* )
          echo "Uploading ${#PART_FILES[@]} parts to Gitee release $RELEASE_ID..."

          for PART_FILE in "${PART_FILES[@]}"; do
            PART_NAME=$(basename "$PART_FILE")
            echo "Uploading $PART_NAME..."
            UPLOAD_RESP=$(curl -fsSL -X POST \
              "${GITEE_API}/releases/${RELEASE_ID}/attach_files" \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${PART_FILE}")
            PART_URL=$(echo "$UPLOAD_RESP" | jq -r '.browser_download_url // .url // empty')
            if [ -z "$PART_URL" ]; then
              echo "::error::Failed to upload $PART_NAME. Response: $UPLOAD_RESP"
              exit 1
            fi
            echo "  -> $PART_URL"

            # Patch update.json: set parts[].url where name == PART_NAME.
            # Uses a script file instead of an inline heredoc because the
            # closing delimiter of a heredoc inside a for-loop would need
            # to be at column 0, which conflicts with the loop's indent.
            python3 .github/scripts/patch_part_url.py "$PART_NAME" "$PART_URL"
          done

          echo "All parts uploaded. Final update.json:"
          cat update/update.json

          echo "gitee_release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "gitee_part_count=${#PART_FILES[@]}" >> "$GITHUB_OUTPUT"

      - name: Commit filled-in part URLs to main
        # The Gitee upload step rewrote parts[].url in update/update.json.
        # Commit that final manifest to main so the app can resolve the
        # part URLs. Without this step the manifest on main would still
        # have empty URLs and the app would fall back to the single
        # GitHub release download (which works but bypasses the Gitee
        # mirror).
        run: |
          git add update/update.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "No URL changes to commit (parts already had URLs)."
            exit 0
          fi
          git commit -m "chore(update): fill Gitee part URLs for ${{ steps.tag.outputs.version_name }}

          - ${{ steps.gitee_release.outputs.gitee_part_count }} parts uploaded to Gitee release ${{ steps.tag.outputs.tag }}
          - parts[].url written back into update.json"
          git push origin HEAD:main
          echo "Pushed part URLs to main"

      - name: Re-mirror update.json to Gitee
        # The earlier "Mirror update/ to Gitee" step ran before the
        # parts were uploaded, so the Gitee copy of update.json still
        # has empty part URLs. Re-sync just update.json so the Gitee
        # mirror matches main.
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set, skipping re-mirror."
            exit 0
          fi
          GITEE_WORKDIR="$RUNNER_TEMP/gitee-work2"
          rm -rf "$GITEE_WORKDIR"
          mkdir -p "$GITEE_WORKDIR"
          cd "$GITEE_WORKDIR"
          git clone --depth 1 --branch "${{ env.GITEE_BRANCH }}" \
            "https://wisebreeze:${GITEE_TOKEN}@gitee.com/${{ env.GITEE_REPO }}.git" .
          git config user.name "wisebreeze"
          git config user.email "12232263+wisebreeze@user.noreply.gitee.com"
          cp "$GITHUB_WORKSPACE/update/update.json" ./update.json
          if [ -z "$(git status --porcelain)" ]; then
            echo "Gitee update.json already up to date."
            exit 0
          fi
          git add update.json
          git commit -m "chore: fill Gitee part URLs for v${{ steps.tag.outputs.version_name }}"
          git push origin "${{ env.GITEE_BRANCH }}"
          echo "Re-mirrored update.json to Gitee"

      - name: Notify Discord (English changelog)
        # Posts the English section of the release body to the CubeVisage
        # Discord server's app channel as a markdown embed.
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_APP_WEBHOOK }}
          CHANGELOG_FILE: /tmp/changelog.md
          VERSION_NAME: ${{ steps.tag.outputs.version_name }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}
          APK_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}/${{ env.APK_ASSET_NAME }}
        run: python3 .github/scripts/notify_discord.py

      - name: Summary
        if: always()
        run: |
          echo "## Release ${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- versionName: \`${{ steps.tag.outputs.version_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- versionCode: \`${{ steps.tag.outputs.version_code }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- APK MD5: \`${{ steps.md5.outputs.md5 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Split parts: \`${{ steps.split.outputs.part_count }}\` × ${{ env.APK_PART_BYTES }} bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Release: https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- Gitee manifest: https://gitee.com/${{ env.GITEE_REPO }}/raw/${{ env.GITEE_BRANCH }}/update.json" >> $GITHUB_STEP_SUMMARY
          echo "- Gitee changelog: https://gitee.com/${{ env.GITEE_REPO }}/raw/${{ env.GITEE_BRANCH }}/changeLog/${{ steps.tag.outputs.version_name }}.md" >> $GITHUB_STEP_SUMMARY
          echo "- Gitee release: https://gitee.com/${{ env.GITEE_REPO }}/releases/tag/${{ steps.tag.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
