name: 'Android CI'

# This workflow lives in the public BreezeLauncherAndroid repo purely to
# consume GitHub Actions free minutes (2000/min/month for private repos).
# Source code is cloned from the private BreezeLauncher repo at build time.
#
# Minify toggle (workflow_dispatch input, default OFF):
#   OFF: skips R8. ~3min faster. APK uploads to THIS public repo's
#     `artifact` release for testing/verification.
#   ON: full R8. APK uploads to THIS public repo's `artifact` release
#     — this is the canonical name that release-on-tag.yml pulls for
#     versioned releases.
# Both builds share the same filename, so uploading a non-R8 build
# overwrites the previous R8 build (and vice versa). Run minify=ON
# before publishing a versioned release so the artifact release holds
# the R8 build when release-on-tag.yml fires.
#
# Three variants are built in parallel, each with a different applicationId:
#   default   -> com.wisebreeze.launcher  (BreezeLauncher-default-release.apk)
#   preloader -> org.levimc.launcher      (BreezeLauncher-preloader-release.apk)  [DISABLED — temporarily not building preloader variant]
#   antutu    -> com.antutu.ABenchMark    (BreezeLauncher-antutu-release.apk)  [DISABLED — no longer building antutu variant]
# The package switch is done by scripts/switch_package.sh (from the private
# repo) which also swaps google-services.json to the combined multi-client
# version so Firebase (FCM/Crashlytics/Analytics) works for all three.

on:
  workflow_dispatch:
    inputs:
      minify:
        description: 'R8 minify'
        type: boolean
        default: false
  repository_dispatch:
    types: [upstream-changed]

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.welcome.provider.enabled=false"
  APP_NAME: "BreezeLauncher"
  JAVA_VERSION: "21"
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: "wisebreeze/BreezeLauncher"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # GITHUB_TOKEN needs contents:write to create releases and
      # upload assets on THIS public repo. The private repo upload
      # uses PRIVATE_REPO_TOKEN separately and is unaffected.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            package: com.wisebreeze.launcher
          # - variant: preloader
          #   package: org.levimc.launcher  # disabled — temporarily not building preloader variant
          # - variant: antutu
          #   package: com.antutu.ABenchMark  # disabled — no longer building antutu variant
    steps:
      - name: Checkout private source repo
        # Shallow clone the private BreezeLauncher repo. Version is derived
        # from the build date (not git tags), so full history is unnecessary.
        # MUST run before setup-java with `cache: gradle`, otherwise
        # setup-java finds no gradle files to hash and fails with
        # "No file matched". PAT must have `repo` scope (or fine-grained:
        # Contents: Read on BreezeLauncher).
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --filter=blob:none --depth 1 --branch main https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git .
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Capture private repo SHA
        # github.sha refers to the public repo's commit (workflow file
        # commit), which does NOT change when only the private repo's
        # source changes. Cache keyed on github.sha would be reused
        # across builds of different private source, causing stale
        # builds. Use the private repo's HEAD SHA instead.
        id: private_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Java JDK
        # Must come AFTER checkout so `cache: gradle` can locate
        # gradle-wrapper.properties / libs.versions.toml in the workspace.
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Purge stale material3 1.3.x from Gradle cache
        # The compose BOM was bumped from 2026.06.00 (material3 1.3.x)
        # to 2026.08.00 (material3 1.4.0). If the runner's Gradle cache
        # still holds the old 1.3.x artifacts, Gradle may not re-resolve
        # and the build fails with "Unresolved reference" for the new
        # M3 Expressive APIs (LinearWavyProgressIndicator, LoadingIndicator,
        # MaterialExpressiveTheme). Wipe the cached material3 dirs so the
        # next build re-downloads 1.4.0 fresh.
        run: |
          rm -rf ~/.gradle/caches/modules-2/files-2.1/androidx.compose.material3
          rm -rf ~/.gradle/caches/modules-2/metadata-2.106/descriptors/androidx.compose.material3
          echo "Purged stale material3 cache"

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v5
        with:
          # Only cache git's internal submodule store, NOT app/src/main/cpp
          # (which also contains main-repo files like breeze/ that change per commit).
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ runner.os }}
          restore-keys: submodules-${{ hashFiles('.gitmodules') }}-

      - name: Init submodules
        # Use the commit recorded in the parent repo (no --remote) so we
        # don't fetch from upstream. This pins the build to the exact
        # submodule SHA checked into main, making builds reproducible and
        # faster (no extra network round-trip to the submodule remote).
        # --filter=blob:none: only fetch blobs that CMake actually reads
        # (libHttpClient is a large Microsoft repo where ~90% of files
        # are Windows/Xbox/iOS platform code we never compile).
        run: git submodule update --init --recursive --filter=blob:none --depth=1
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        timeout-minutes: 8

      - name: Switch package for this variant
        # Switch applicationId + CompatibilityLauncher constant +
        # google-services.json to the matrix variant's package. The
        # combined google-services.json has all three Firebase Android
        # apps registered, so FCM/Crashlytics/Analytics work regardless.
        run: bash scripts/switch_package.sh ${{ matrix.package }}

      - name: Cache native build output (.cxx)
        # CMake's incremental build state lives in app/.cxx. Key it ONLY on
        # C/C++ sources + CMakeLists + NDK version + variant, so a pure
        # Kotlin/resource change does NOT invalidate the native cache (the
        # .so files are unchanged and CMake skips recompilation entirely).
        # Conversely, a C++ change should NOT invalidate the Kotlin/dex/R8
        # cache below — splitting the two caches is what keeps a frequent
        # C++ edit from forcing a full Kotlin recompile + R8 pass.
        uses: actions/cache@v5
        with:
          path: app/.cxx
          # NDK version is part of the key because a different NDK produces
          # incompatible .o files; restoring a .cxx built with another NDK
          # would break the link step.
          #
          # hashFiles scope is deliberately narrow: leveldb-src/lib/zlib
          # (3.6M, 42 .c files) and 24 *_test.cc / db_bench.cc files are
          # NOT compiled (CMakeLists uses the NDK's libz, tests are never
          # added to the build), so hashing them only causes spurious cache
          # misses when those dead files are touched. Only hash the dirs
          # that actually feed the compiler.
          key: cxx-${{ matrix.variant }}-${{ runner.os }}-ndk29-${{ hashFiles('app/src/main/cpp/**/CMakeLists.txt', 'app/src/main/cpp/breeze/**', 'app/src/main/cpp/inbuiltmods/**', 'app/src/main/cpp/memoryeditor/**', 'app/src/main/cpp/mtbinloader2/**', 'app/src/main/cpp/leveldbjni/**', 'app/src/main/cpp/leveldb-src/src/**', 'app/src/main/cpp/leveldb-src/CMakeLists.txt') }}
          restore-keys: |
            cxx-${{ matrix.variant }}-${{ runner.os }}-ndk29-

      - name: Cache build outputs
        uses: actions/cache@v5
        with:
          path: |
            app/build
            minecraft/build
          # Key on the variant FIRST — different applicationId produces
          # different BuildConfig (APPLICATION_ID) and processed manifest,
          # so build outputs are NOT interchangeable across variants.
          # Without variant in the key, parallel jobs would collide on
          # the same key and one variant could restore another's stale
          # BuildConfig, producing an APK with the wrong package name.
          #
          # Also key on the private repo's HEAD SHA (not github.sha which
          # is this public repo's workflow commit SHA — it would be stale
          # across builds of different private source).
          #
          # NOTE: the C/C++ source hash is intentionally NOT part of this
          # key. Native build state (.cxx) is cached separately above, so
          # a C++ edit no longer discards the Kotlin/dex/R8 outputs here.
          # CMake still recompiles correctly (incremental via the .cxx
          # cache), and the changed .so is picked up by the packaging step.
          #
          # Also key on the minify toggle — minified and unminified
          # builds produce completely different dex/mapping outputs, so
          # a cache restore across the two states would corrupt the build.
          key: build-${{ matrix.variant }}-${{ inputs.minify == true && 'min' || 'nom' }}-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-${{ steps.private_sha.outputs.sha }}
          restore-keys: |
            build-${{ matrix.variant }}-${{ inputs.minify == true && 'min' || 'nom' }}-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-

      - name: Install ccache
        # ccache wraps the C/C++ compiler and caches preprocessed .o
        # outputs keyed on source hash + compiler flags. Even when the
        # .cxx cache misses (C++ source changed, or cache evicted), ccache
        # restores the .o for any unchanged translation unit in ~ms
        # instead of recompiling. For the ~53K LOC native tree this turns
        # a full rebuild from ~3min into ~10s of cache restores.
        run: |
          sudo apt-get install -y ccache
          ccache --version
          # Default size is 5GB; 2G is enough for this project's ~240
          # C/C++ TUs and leaves runner disk headroom for Gradle/AGP.
          ccache -M 2G

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          # Key on the same narrow source set as the .cxx cache so a
          # C++ edit bumps both consistently. NDK version is in the key
          # because ccache entries are compiler-version specific.
          key: ccache-${{ matrix.variant }}-${{ runner.os }}-ndk29-${{ hashFiles('app/src/main/cpp/**/CMakeLists.txt', 'app/src/main/cpp/breeze/**', 'app/src/main/cpp/inbuiltmods/**', 'app/src/main/cpp/memoryeditor/**', 'app/src/main/cpp/mtbinloader2/**', 'app/src/main/cpp/leveldbjni/**', 'app/src/main/cpp/leveldb-src/src/**', 'app/src/main/cpp/leveldb-src/CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ matrix.variant }}-${{ runner.os }}-ndk29-

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          # Point ccache at its cache dir and enable stats so the build
          # log shows hit/miss counts for tuning.
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Setup APK name
        id: apk_name
        run: |
          echo "build_type=release" >> $GITHUB_OUTPUT
          echo "assemble_task=assembleRelease" >> $GITHUB_OUTPUT
          echo "apk_dir=app/build/outputs/apk/release" >> $GITHUB_OUTPUT
          echo "final_name=${{ env.APP_NAME }}-${{ matrix.variant }}-release.apk" >> $GITHUB_OUTPUT
          # Pass -Pbreeze.minify=false when minify is off so the Gradle
          # build skips R8 + resource shrinking entirely.
          if [ "${{ inputs.minify }}" = "true" ]; then
            echo "gradle_args=" >> $GITHUB_OUTPUT
          else
            echo "gradle_args=-Pbreeze.minify=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          echo "Building ${{ steps.apk_name.outputs.build_type }} APK (variant=${{ matrix.variant }}, package=${{ matrix.package }}, minify=${{ inputs.minify }})..."
          ./gradlew ${{ steps.apk_name.outputs.assemble_task }} ${{ steps.apk_name.outputs.gradle_args }} --no-daemon --parallel --build-cache --warn

      - name: Show ccache stats
        # Print hit/miss counts so CI logs show whether the native cache
        # is actually being reused. A low hit rate on an incremental
        # build means the cache key is too narrow or ccache is not being
        # invoked; a high hit rate confirms the speedup is real.
        if: always()
        run: ccache -s

      - name: Decode and setup keystore
        # The release APK is signed with the production keystore. The
        # app's AppInitializer signature check rejects any APK whose
        # signing certificate SHA-256 != CONFIG_KEY, so the default
        # debug keystore would crash on startup. Signing with the
        # production keystore makes the release build runnable on a
        # real device.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Sign APK with custom keystore
        run: |
          APK_IN=$(find ${{ steps.apk_name.outputs.apk_dir }} -name "*.apk" | head -1)
          APK_OUT="${{ env.APP_NAME }}-${{ matrix.variant }}-${{ steps.apk_name.outputs.build_type }}-signed.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "$APK_IN"
          mv "$APK_OUT" "${{ steps.apk_name.outputs.final_name }}"
          rm -f "$APK_IN"
          rm -f keystore.jks

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar verify --print-certs "${{ steps.apk_name.outputs.final_name }}"

      - name: Ensure artifact release exists
        # Both minified and non-minified builds publish to THIS public
        # repo's `artifact` release. They coexist thanks to the distinct
        # filename (-nominify suffix on the non-R8 build). `|| true`
        # tolerates the parallel race when multiple matrix jobs run.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "${{ github.repository }}" \
            --title "BreezeLauncher Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest APK is always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "${{ github.repository }}" >/dev/null

      - name: Upload APK to artifact release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK_FILE="${{ steps.apk_name.outputs.final_name }}"
          gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" --repo "${{ github.repository }}" 2>/dev/null || true
          gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" --clobber --repo "${{ github.repository }}"
          echo "Uploaded $APK_FILE to artifact release on ${{ github.repository }}"

      - name: Cleanup stale build caches
        # Caches live on THIS public repo (caches are scoped per-repo
        # and cannot be shared across repos). GitHub only evicts caches
        # when the 10GB repo limit is hit (LRU), so caches keyed on
        # private repo SHA / cpp hash from old commits linger indefinitely.
        # Each private commit creates a new build-{variant}-{...}-{sha}
        # cache, and each C++ edit creates new cxx-{...} / ccache-{...}
        # caches, none of which is read again once the next commit lands,
        # so they pile up and slow down `gh cache list` / restore-key
        # matching. This step deletes build- / cxx- / ccache- caches not
        # accessed in the last 7 days. Runs with `if: always()` so
        # cleanup still happens when an earlier step fails.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for prefix in build- cxx- ccache-; do
            gh cache list --key "$prefix" --json id,key,lastAccessedAt --limit 200 | \
              python3 -c '
          import sys, json, datetime
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
          for c in json.load(sys.stdin):
              la = datetime.datetime.fromisoformat(c["lastAccessedAt"].replace("Z", "+00:00"))
              if la < cutoff:
                  print(c["id"])
          ' | while read -r id; do
              if [ -n "$id" ]; then
                echo "Deleting stale cache id=$id"
                gh cache delete "$id" --confirm || true
              fi
            done
          done
