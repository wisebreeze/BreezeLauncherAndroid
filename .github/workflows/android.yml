name: 'Android CI'

# This workflow lives in the public BreezeLauncherAndroid repo purely to
# consume GitHub Actions free minutes (2000/min/month for private repos).
# Source code is cloned from the private BreezeLauncher repo at build time.
#
# Minify toggle (workflow_dispatch input, default OFF):
#   OFF: skips R8. ~3min faster. APK uploads to the PRIVATE repo's
#     `artifact` release — internal verification only.
#   ON: full R8. APK uploads to THIS public repo's `artifact` release
#     for public download.
#
# Three variants are built in parallel, each with a different applicationId:
#   default   -> com.wisebreeze.launcher  (BreezeLauncher-default-release.apk)
#   preloader -> org.levimc.launcher      (BreezeLauncher-preloader-release.apk)  [DISABLED — temporarily not building preloader variant]
#   antutu    -> com.antutu.ABenchMark    (BreezeLauncher-antutu-release.apk)  [DISABLED — no longer building antutu variant]
# The package switch is done by scripts/switch_package.sh (from the private
# repo) which also swaps google-services.json to the combined multi-client
# version so Firebase (FCM/Crashlytics/Analytics) works for all three.

on:
  workflow_dispatch:
    inputs:
      minify:
        description: 'R8 minify'
        type: boolean
        default: false

env:
  GRADLE_OPTS: "-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.welcome.provider.enabled=false"
  APP_NAME: "BreezeLauncher"
  JAVA_VERSION: "21"
  ARTIFACT_RELEASE_TAG: "artifact"
  PRIVATE_REPO: "wisebreeze/BreezeLauncher"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN needs contents:write to create releases and
      # upload assets on THIS public repo. The private repo upload
      # uses PRIVATE_REPO_TOKEN separately and is unaffected.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            package: com.wisebreeze.launcher
          # - variant: preloader
          #   package: org.levimc.launcher  # disabled — temporarily not building preloader variant
          # - variant: antutu
          #   package: com.antutu.ABenchMark  # disabled — no longer building antutu variant
    steps:
      - name: Checkout private source repo
        # Shallow clone the private BreezeLauncher repo. Version is derived
        # from the build date (not git tags), so full history is unnecessary.
        # MUST run before setup-java with `cache: gradle`, otherwise
        # setup-java finds no gradle files to hash and fails with
        # "No file matched". PAT must have `repo` scope (or fine-grained:
        # Contents: Read on BreezeLauncher).
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: |
          git clone --depth 1 --branch main https://x-access-token:${PRIVATE_REPO_TOKEN}@github.com/${PRIVATE_REPO}.git .
          git config user.name "wisebreeze"
          git config user.email "wisebreeze@users.noreply.github.com"

      - name: Capture private repo SHA
        # github.sha refers to the public repo's commit (workflow file
        # commit), which does NOT change when only the private repo's
        # source changes. Cache keyed on github.sha would be reused
        # across builds of different private source, causing stale
        # builds. Use the private repo's HEAD SHA instead.
        id: private_sha
        run: echo "sha=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Setup Java JDK
        # Must come AFTER checkout so `cache: gradle` can locate
        # gradle-wrapper.properties / libs.versions.toml in the workspace.
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Cache submodules
        id: cache-submodules
        uses: actions/cache@v5
        with:
          # Only cache git's internal submodule store, NOT app/src/main/cpp
          # (which also contains main-repo files like breeze/ that change per commit).
          path: .git/modules
          key: submodules-${{ hashFiles('.gitmodules') }}-${{ runner.os }}
          restore-keys: submodules-${{ hashFiles('.gitmodules') }}-

      - name: Init submodules
        # Use the commit recorded in the parent repo (no --remote) so we
        # don't fetch from upstream. This pins the build to the exact
        # submodule SHA checked into main, making builds reproducible and
        # faster (no extra network round-trip to the submodule remote).
        run: git submodule update --init --recursive --depth=1
        env:
          GIT_LFS_SKIP_SMUDGE: 1
        timeout-minutes: 8

      - name: Switch package for this variant
        # Switch applicationId + CompatibilityLauncher constant +
        # google-services.json to the matrix variant's package. The
        # combined google-services.json has all three Firebase Android
        # apps registered, so FCM/Crashlytics/Analytics work regardless.
        run: bash scripts/switch_package.sh ${{ matrix.package }}

      - name: Cache build outputs
        uses: actions/cache@v5
        with:
          path: |
            app/build
            app/.cxx
            minecraft/build
          # Key on the variant FIRST — different applicationId produces
          # different BuildConfig (APPLICATION_ID) and processed manifest,
          # so build outputs are NOT interchangeable across variants.
          # Without variant in the key, parallel jobs would collide on
          # the same key and one variant could restore another's stale
          # BuildConfig, producing an APK with the wrong package name.
          #
          # Also key on the private repo's HEAD SHA (not github.sha which
          # is this public repo's workflow commit SHA — it would be stale
          # across builds of different private source).
          #
          # Also key on the C/C++ source hash so a native change bumps
          # the cache key — without this, a C++ edit would restore a
          # stale app/build and CMake would still recompile correctly
          # (incremental), but if app/build was evicted the CMake cache
          # (.cxx) would be gone and force a full native rebuild.
          #
          # Also key on the minify toggle — minified and unminified
          # builds produce completely different dex/mapping outputs, so
          # a cache restore across the two states would corrupt the build.
          key: build-${{ matrix.variant }}-${{ inputs.minify == true && 'min' || 'nom' }}-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-${{ hashFiles('app/src/main/cpp/**') }}-${{ steps.private_sha.outputs.sha }}
          restore-keys: |
            build-${{ matrix.variant }}-${{ inputs.minify == true && 'min' || 'nom' }}-${{ runner.os }}-${{ hashFiles('gradle.properties', 'gradle/libs.versions.toml', 'settings.gradle.kts') }}-${{ hashFiles('app/src/main/res/**/strings.xml') }}-${{ hashFiles('app/src/main/cpp/**') }}-

      - name: Setup Android NDK Environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: echo "curseforge.api_key=${CF_API_KEY}" >> local.properties

      - name: Setup APK name
        id: apk_name
        run: |
          echo "build_type=release" >> $GITHUB_OUTPUT
          echo "assemble_task=assembleRelease" >> $GITHUB_OUTPUT
          echo "apk_dir=app/build/outputs/apk/release" >> $GITHUB_OUTPUT
          echo "final_name=${{ env.APP_NAME }}-${{ matrix.variant }}-release.apk" >> $GITHUB_OUTPUT
          # Pass -Pbreeze.minify=false when minify is off so the Gradle
          # build skips R8 + resource shrinking entirely.
          if [ "${{ inputs.minify }}" = "true" ]; then
            echo "gradle_args=" >> $GITHUB_OUTPUT
          else
            echo "gradle_args=-Pbreeze.minify=false" >> $GITHUB_OUTPUT
          fi

      - name: Build APK
        run: |
          echo "Building ${{ steps.apk_name.outputs.build_type }} APK (variant=${{ matrix.variant }}, package=${{ matrix.package }}, minify=${{ inputs.minify }})..."
          ./gradlew ${{ steps.apk_name.outputs.assemble_task }} ${{ steps.apk_name.outputs.gradle_args }} --no-daemon --parallel --build-cache --warn

      - name: Decode and setup keystore
        # The release APK is signed with the production keystore. The
        # app's AppInitializer signature check rejects any APK whose
        # signing certificate SHA-256 != CONFIG_KEY, so the default
        # debug keystore would crash on startup. Signing with the
        # production keystore makes the release build runnable on a
        # real device.
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Sign APK with custom keystore
        run: |
          APK_IN=$(find ${{ steps.apk_name.outputs.apk_dir }} -name "*.apk" | head -1)
          APK_OUT="${{ env.APP_NAME }}-${{ matrix.variant }}-${{ steps.apk_name.outputs.build_type }}-signed.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar sign \
            --ks keystore.jks \
            --ks-pass pass:${{ secrets.KEYSTORE_PASS }} \
            --key-pass pass:${{ secrets.KEY_PASS }} \
            --ks-key-alias ${{ secrets.KEY_ALIAS }} \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled true \
            --out "$APK_OUT" \
            "$APK_IN"
          mv "$APK_OUT" "${{ steps.apk_name.outputs.final_name }}"
          rm -f "$APK_IN"
          rm -f keystore.jks

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/*/ | sort -V | tail -1)
          java -jar $BUILD_TOOLS/lib/apksigner.jar verify --print-certs "${{ steps.apk_name.outputs.final_name }}"

      - name: Ensure artifact release exists
        # When minify is ON, publish to THIS public repo for public download
        # (uses default GITHUB_TOKEN). When OFF, publish to the PRIVATE repo
        # for internal verification (uses PRIVATE_REPO_TOKEN). `|| true`
        # tolerates the parallel race when multiple matrix jobs run.
        env:
          GH_TOKEN: ${{ inputs.minify && secrets.GITHUB_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.minify && github.repository || env.PRIVATE_REPO }}
        run: |
          gh release create ${{ env.ARTIFACT_RELEASE_TAG }} \
            --repo "$TARGET_REPO" \
            --title "BreezeLauncher Build Artifacts" \
            --notes "Automated build artifacts from CI. The latest APK is always attached to this release." \
            --draft=false --prerelease=false 2>/dev/null || gh release view ${{ env.ARTIFACT_RELEASE_TAG }} --repo "$TARGET_REPO" >/dev/null

      - name: Upload APK to artifact release
        env:
          GH_TOKEN: ${{ inputs.minify && secrets.GITHUB_TOKEN || secrets.PRIVATE_REPO_TOKEN }}
          TARGET_REPO: ${{ inputs.minify && github.repository || env.PRIVATE_REPO }}
        run: |
          APK_FILE="${{ steps.apk_name.outputs.final_name }}"
          gh release delete-asset ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" --repo "$TARGET_REPO" 2>/dev/null || true
          gh release upload ${{ env.ARTIFACT_RELEASE_TAG }} "$APK_FILE" --clobber --repo "$TARGET_REPO"
          echo "Uploaded $APK_FILE to artifact release on $TARGET_REPO"

      - name: Cleanup stale build caches
        # Caches live on THIS public repo (caches are scoped per-repo
        # and cannot be shared across repos). GitHub only evicts caches
        # when the 10GB repo limit is hit (LRU), so caches keyed on
        # private repo SHA from old commits linger indefinitely. Each
        # private commit creates a new build-{variant}-{...}-{sha} cache
        # that is never read again once the next commit lands, so they
        # pile up and slow down `gh cache list` / restore-key matching.
        # This step deletes build- caches not accessed in the last 7 days.
        # Runs with `if: always()` so cleanup still happens when an
        # earlier step fails.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh cache list --key "build-" --json id,key,lastAccessedAt --limit 200 | \
            python3 -c '
          import sys, json, datetime
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=7)
          for c in json.load(sys.stdin):
              la = datetime.datetime.fromisoformat(c["lastAccessedAt"].replace("Z", "+00:00"))
              if la < cutoff:
                  print(c["id"])
          ' | while read -r id; do
            if [ -n "$id" ]; then
              echo "Deleting stale cache id=$id"
              gh cache delete "$id" --confirm || true
            fi
          done
